<header><h1>美食選購</h1><p>選好數量，按「結帳」產生訂單再傳給我</p></header>

<script>
var C={};

var SHA_K=[],SHA_H=[];

function norm(v){return String(v||"").replace(/[\uFF01-\uFF5E]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).replace(/\s+/g,"").toUpperCase()}
var DPLAIN={},DHASH={},DKEY={},DSALT=(typeof DISCOUNT_SALT!=="undefined"&&DISCOUNT_SALT)?String(DISCOUNT_SALT):"";
(function(){var src=(typeof DISCOUNTS!=="undefined"&&DISCOUNTS)?DISCOUNTS:{};Object.keys(src).forEach(function(k){
  if(/^[0-9a-fA-F]{64}$/.test(k))DHASH[k.toLowerCase()]=src[k];else{var n=norm(k);DPLAIN[n]=src[k];DKEY[n]=k}})})();
